name: Android CI — Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'          # Стабильные релизы: v1.0, v2.0.1
      - 'pre*'        # Pre-релизы: pre-1.0, pre-v1.0
      - 'beta*'       # Beta-релизы: beta-1.0, beta.1
      - 'alpha*'      # Alpha-релизы: alpha-1.0
      - 'rc*'         # Release candidates: rc-1.0, rc1
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ─── Сборка ───────────────────────────────────────────────────────────────
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ─── Релиз (при любых тегах v*, pre*, beta*, alpha*, rc*) ─────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download built APK artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk-dir

      - name: Prepare APK with version tag
        run: |
          TAG="${{ github.ref_name }}"
          # Находим скомпилированный APK и переименовываем
          APK_FILE=$(find apk-dir -name "*.apk" | head -n 1)
          cp "$APK_FILE" "open-polar-h10-ecg-logger-${TAG}.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ startsWith(github.ref_name, 'v') && 'Release' || 'Pre-release' }} ${{ github.ref_name }}"
          body: |
            ## Open Polar H10 ECG Logger — ${{ github.ref_name }}

            ${{ !startsWith(github.ref_name, 'v') && '⚠️ **Внимание:** Это тестовая pre-release сборка.' || '' }}

            ### Установка
            1. Скачайте APK-файл ниже
            2. На Android устройстве разрешите установку из неизвестных источников
            3. Установите APK

            > ℹ️ Это debug-сборка. Для production используйте signed release APK.
          files: open-polar-h10-ecg-logger-${{ github.ref_name }}.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref_name, 'v') }}
